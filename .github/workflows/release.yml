name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux: static (musl), for any distribution.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          target="${{ matrix.target }}"
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="passbolt-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md "$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/passbolt-mcp.exe" "$name"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/passbolt-mcp" "$name"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  mcpb:
    name: Claude Desktop bundle
    needs: binaries
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Bundle
        run: |
          set -euo pipefail
          cd dist
          for archive in *.tar.gz; do tar xzf "$archive"; done
          unzip -q "passbolt-mcp-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
          mkdir -p bundle/server
          cp ../packaging/mcpb/manifest.json bundle/
          # One binary for both Macs; Claude Desktop adds .exe on Windows.
          lipo -create -output bundle/server/passbolt-mcp \
            "passbolt-mcp-${GITHUB_REF_NAME}-aarch64-apple-darwin/passbolt-mcp" \
            "passbolt-mcp-${GITHUB_REF_NAME}-x86_64-apple-darwin/passbolt-mcp"
          cp "passbolt-mcp-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc/passbolt-mcp.exe" bundle/server/
          bundle="passbolt-mcp-${GITHUB_REF_NAME}.mcpb"
          npx -y @anthropic-ai/mcpb@2.1.2 validate bundle/manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack bundle "$bundle"
          shasum -a 256 "$bundle" > "$bundle.sha256"
          echo "BUNDLE=dist/$bundle" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUNDLE }}
            ${{ env.BUNDLE }}.sha256

  homebrew:
    name: Homebrew formula
    needs: binaries
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Formula
        run: bash scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" dist > passbolt-mcp.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: passbolt-mcp.rb
      # Into the tap scadra/homebrew-tap, when the token is set.
      - if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/scadra/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp passbolt-mcp.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/passbolt-mcp.rb
          git commit -m "passbolt-mcp ${GITHUB_REF_NAME}"
          git push

  crates:
    name: crates.io
    needs: binaries
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
