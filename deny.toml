[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Through pgp 0.21, in passbolt-sdk: to fix there, not here.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 (Marvin), through pgp in passbolt-sdk" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5, through pgp in passbolt-sdk" },
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
