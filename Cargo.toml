[package]
name = "passbolt-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Passbolt MCP server — an AI agent works with Passbolt through a user of its own"
license = "AGPL-3.0-or-later"
repository = "https://github.com/scadra/passbolt-mcp"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
passbolt-sdk = { package = "switch-case-passbolt-sdk", version = "0.1.2", features = ["native", "totp"] }
rand = "0.8"
rmcp = { version = "3.9", features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
rmcp = { version = "3.9", features = ["client", "transport-child-process"] }
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
